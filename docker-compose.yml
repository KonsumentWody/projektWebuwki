services:

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DB_DIR: "/data"
      CORS_ORIGIN: "http://localhost:8080"
      NODE_ENV: "production"
    volumes:
      - f1_data:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  f1_data:
