services:

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      DB_DIR: "/data"
      CORS_ORIGIN: "http://localhost:8080"
      NODE_ENV: "production"
    volumes:
      - f1_data:/data          # persistent SQLite database
    expose:
      - "3001"                 # internal only – nginx talks to it directly
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"              # http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  f1_data:
